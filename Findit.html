<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Findit – แจ้งของหาย ตามหาของเจอ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f7fb;--card:#fff;--tx:#14213d;--mut:#5f6b85;--bd:#dde4f0;--pri:#2563eb;--pri-t:#fff;--lost:#dc2626;--lostbg:#fee2e2;--found:#059669;--foundbg:#d1fae5;--done:#6b7280}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1424;--card:#172038;--tx:#e8edf8;--mut:#9aa6c4;--bd:#2a3556;--pri:#5b8dff;--pri-t:#0b1020;--lost:#f87171;--lostbg:#3b1a1f;--found:#34d399;--foundbg:#10342a;--done:#9ca3af}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1424;--card:#172038;--tx:#e8edf8;--mut:#9aa6c4;--bd:#2a3556;--pri:#5b8dff;--pri-t:#0b1020;--lost:#f87171;--lostbg:#3b1a1f;--found:#34d399;--foundbg:#10342a;--done:#9ca3af}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Sarabun',system-ui,sans-serif;font-size:16px;line-height:1.5}
header{background:var(--pri);color:var(--pri-t);padding:22px 16px 26px;text-align:center}
header h1{margin:0;font-size:34px;letter-spacing:.5px}
header p{margin:4px 0 0;opacity:.9}
main{max-width:860px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-22px 0 16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}.stat span{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:20px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:72px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
button{font:inherit;font-weight:600;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
button.on{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
button.sm{padding:6px 10px;font-size:14px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
@media(max-width:560px){.filters{grid-template-columns:1fr}}
.item{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px;background:var(--bg)}
.item.done{opacity:.6}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item h3{margin:0;font-size:18px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;margin-right:6px}
.tag.lost{background:var(--lostbg);color:var(--lost)}.tag.found{background:var(--foundbg);color:var(--found)}.tag.done{background:var(--bd);color:var(--done)}
.meta{color:var(--mut);font-size:14px;margin:4px 0}
.contact{font-weight:600;word-break:break-all}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:24px}
.note{font-size:13px;color:var(--mut);margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;display:none;z-index:9}
</style>
</head>
<body>
<header><h1>🔎 Findit</h1><p>แจ้งของหาย • แจ้งเจอของ • ช่วยกันตามหาเจ้าของ</p></header>
<main>
<div class="stats">
<div class="stat"><b id="sL">0</b><span>ของหาย</span></div>
<div class="stat"><b id="sF">0</b><span>เจอของ</span></div>
<div class="stat"><b id="sD">0</b><span>ได้คืนแล้ว</span></div>
</div>

<div class="card">
<h2>แจ้งรายการใหม่</h2>
<div class="tabs">
<button type="button" id="tLost" class="on">😢 ฉันของหาย</button>
<button type="button" id="tFound">🙌 ฉันเจอของ</button>
</div>
<div id="fm">
<label for="name">ชื่อสิ่งของ *</label>
<input id="name" maxlength="60" placeholder="เช่น กระเป๋าสตางค์สีดำ, ขวดน้ำ, บัตรนักเรียน">
<div class="row">
<div><label for="cat">หมวดหมู่</label>
<select id="cat"><option>เครื่องเขียน/หนังสือ</option><option>อุปกรณ์อิเล็กทรอนิกส์</option><option>กระเป๋า/กระเป๋าสตางค์</option><option>บัตร/เอกสาร</option><option>เสื้อผ้า/เครื่องแต่งกาย</option><option>ขวดน้ำ/กล่องข้าว</option><option>กุญแจ</option><option>อื่น ๆ</option></select></div>
<div><label for="date">วันที่</label><input id="date" type="date"></div>
</div>
<label for="place" id="lPlace">สถานที่ที่ทำหาย *</label>
<input id="place" maxlength="80" placeholder="เช่น โรงอาหาร, อาคาร 3 ห้อง 305, สนามบาส">
<label for="desc">รายละเอียด / ตำหนิ</label>
<textarea id="desc" maxlength="300" placeholder="สี ยี่ห้อ ลักษณะเด่น (ไม่ควรใส่ข้อมูลที่เจ้าของต้องยืนยัน เช่น เลขบัตร)"></textarea>
<label for="who">ชื่อผู้แจ้ง *</label>
<input id="who" maxlength="40" placeholder="ชื่อ / ชั้น เช่น คิมหันต์ ม.6/1">
<label for="contact">ช่องทางติดต่อ *</label>
<input id="contact" maxlength="60" placeholder="Line ID / เบอร์โทร / Instagram">
<div style="margin-top:14px"><button type="button" class="pri" id="submit">ส่งประกาศ</button></div>
<div class="note" id="mode"></div>
</div>
</div>

<div class="card">
<h2>รายการทั้งหมด</h2>
<div class="filters">
<input id="q" placeholder="🔍 ค้นหาชื่อ สถานที่ รายละเอียด">
<select id="ft"><option value="">ทุกประเภท</option><option value="lost">ของหาย</option><option value="found">เจอของ</option></select>
<select id="fs"><option value="open">ยังไม่ได้คืน</option><option value="done">ได้คืนแล้ว</option><option value="">ทั้งหมด</option></select>
</div>
<div id="list"></div>
</div>
</main>
<div id="toast"></div>

<script>
(function(){
var type='lost', items=[], store=null, LS='findit-items';
var $=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2400)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function thDate(s){if(!s)return '';var p=s.split('-');var m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return +p[2]+' '+m[+p[1]-1]+' '+(+p[0]+543)}
$('date').value=today();

function setType(t){type=t;$('tLost').className=t==='lost'?'on':'';$('tFound').className=t==='found'?'on':'';
$('lPlace').textContent=t==='lost'?'สถานที่ที่ทำหาย *':'สถานที่ที่เจอ / ฝากไว้ที่ *'}
$('tLost').onclick=function(){setType('lost')};$('tFound').onclick=function(){setType('found')};

function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return []}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(items))}catch(e){}}

function render(){
 var q=$('q').value.trim().toLowerCase(),ft=$('ft').value,fs=$('fs').value;
 var L=0,F=0,D=0;items.forEach(function(x){if(x.done)D++;else if(x.type==='lost')L++;else F++});
 $('sL').textContent=L;$('sF').textContent=F;$('sD').textContent=D;
 var rows=items.filter(function(x){
  if(ft&&x.type!==ft)return false;
  if(fs==='open'&&x.done)return false;
  if(fs==='done'&&!x.done)return false;
  if(q&&(x.name+' '+x.place+' '+x.desc+' '+x.cat).toLowerCase().indexOf(q)<0)return false;
  return true}).sort(function(a,b){return (b.created||0)-(a.created||0)});
 if(!rows.length){$('list').innerHTML='<div class="empty">ยังไม่มีรายการ</div>';return}
 $('list').innerHTML=rows.map(function(x){
  var tag=x.type==='lost'?'<span class="tag lost">ของหาย</span>':'<span class="tag found">เจอของ</span>';
  if(x.done)tag+='<span class="tag done">✔ ได้คืนแล้ว</span>';
  return '<div class="item'+(x.done?' done':'')+'"><div class="top"><div>'+tag+'<h3>'+esc(x.name)+'</h3></div></div>'+
  '<div class="meta">📍 '+esc(x.place)+' • 📅 '+thDate(x.date)+' • 🏷️ '+esc(x.cat)+'</div>'+
  (x.desc?'<div>'+esc(x.desc)+'</div>':'')+
  '<div class="meta">แจ้งโดย '+esc(x.who)+' • ติดต่อ: <span class="contact">'+esc(x.contact)+'</span></div>'+
  '<div class="acts">'+(x.done?'':'<button class="sm" data-a="done" data-id="'+esc(x.id)+'">✔ '+(x.type==='lost'?'เจอแล้ว':'คืนเจ้าของแล้ว')+'</button>')+
  '<button class="sm" data-a="del" data-id="'+esc(x.id)+'">🗑️ ลบ</button></div></div>'}).join('')
}
['q','ft','fs'].forEach(function(i){$(i).oninput=render;$(i).onchange=render});

$('list').onclick=function(e){
 var b=e.target.closest('button');if(!b)return;var id=b.getAttribute('data-id'),a=b.getAttribute('data-a');
 if(a==='del'&&!confirm('ลบรายการนี้?'))return;
 if(store){
  var ref=store.collection('items').doc(id);
  (a==='done'?ref.update({done:true}):ref.delete()).catch(function(){toast('ไม่มีสิทธิ์แก้ไขรายการนี้')});
 }else{
  if(a==='done')items.forEach(function(x){if(x.id===id)x.done=true});
  else items=items.filter(function(x){return x.id!==id});
  lsSave();render();
 }
};

$('submit').onclick=function(){
 var o={type:type,name:$('name').value.trim(),cat:$('cat').value,date:$('date').value,place:$('place').value.trim(),
  desc:$('desc').value.trim(),who:$('who').value.trim(),contact:$('contact').value.trim(),done:false,created:Date.now()};
 if(!o.name||!o.place||!o.who||!o.contact){toast('กรอกช่องที่มี * ให้ครบก่อนนะ');return}
 function ok(){['name','place','desc'].forEach(function(i){$(i).value=''});toast('ส่งประกาศเรียบร้อย ✔');setType(type)}
 if(store){
  store.collection('items').add(o).then(ok).catch(function(){toast('บันทึกไม่ได้ (ไม่มีสิทธิ์เขียน) ลองใหม่อีกครั้ง')});
 }else{
  o.id='l'+o.created;items.push(o);lsSave();render();ok();
 }
};

function startLocal(){items=lsLoad();$('mode').textContent='โหมดออฟไลน์: ข้อมูลเก็บในเครื่องนี้เท่านั้น';render()}
startLocal();

// ใช้ฐานข้อมูลร่วมกัน (ทุกคนที่เปิดลิงก์เห็นรายการเดียวกัน) ถ้ามีสิทธิ์
try{
 if(window.claude&&claude.use){
  claude.use('db').then(function(db){
   if(!db)return;
   store=db;$('mode').textContent='เชื่อมต่อฐานข้อมูลร่วมกันแล้ว: ทุกคนเห็นประกาศเดียวกันแบบเรียลไทม์';
   db.collection('items').onSnapshot(function(snap){
    items=snap.docs.map(function(d){var x=d.data();x.id=d.id;return x});render()
   },function(){store=null;startLocal()});
  }).catch(function(){})
 }
}catch(e){}
})();
</script>
</body>
</html>
